; PHP settings used by the desktop shell (extension_dir is passed on the command line)
extension=com_dotnet
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=openssl
extension=fileinfo
extension=curl
; Keeps compiled PHP in memory: the local server re-reads Laravel on every click otherwise (about 10x slower).
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.revalidate_freq=2
date.timezone=Asia/Manila
memory_limit=512M
max_execution_time=0
